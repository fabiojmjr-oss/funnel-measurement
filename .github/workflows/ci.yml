name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the DuckDB CLI
        run: make duckdb

      - name: Build every model
        run: make build

      - name: Run every assertion
        run: make check

      - name: Print the published tables
        run: make report
